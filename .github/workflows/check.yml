name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check

  distribution:
    name: Plugin-free packaging (${{ matrix.os }}, ${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        artifact: [wheel, sdist]
    # PowerShell on both, so one script handles Windows paths and the venv's Scripts\python.exe.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build and install a clean distribution
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:RUNNER_TEMP "poser-dist"
          $venv = Join-Path $env:RUNNER_TEMP "poser-venv"
          uv build --out-dir $dist
          uv venv --python 3.13 $venv
          $python = Join-Path $venv ($IsWindows ? "Scripts/python.exe" : "bin/python")
          $suffix = if ($env:ARTIFACT -eq "wheel") { "*.whl" } else { "*.tar.gz" }
          $artifact = @(Get-ChildItem -Path $dist -Filter $suffix)
          if ($artifact.Count -ne 1) { throw "expected one $suffix in $dist, found $($artifact.Count)" }
          uv pip install --python $python $artifact[0].FullName
          "POSER_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Smoke packaging only (no real plugin or audio acceptance)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:RUNNER_TEMP
          & $env:POSER_PYTHON -I (Join-Path $env:GITHUB_WORKSPACE "scripts/check_distribution.py")

  windows:
    name: Windows (plugin-free suite, documented studio, Surge XT, and scsynth)
    runs-on: windows-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Show which interpreter the tests start
        run: uv run python -c "import sys; print(sys.executable); print(sys._base_executable)"
      # The installer from the Surge XT 1.3.4 release, with its default components, as a user
      # runs it. The release publishes no digest; the pin is computed from a download.
      - name: Install Surge XT (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          SURGE_URL: https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-win64-1.3.4-setup.exe
          SURGE_SHA256: 6e221e05f29254508142b9e0ed76a85f22fa1b512501bebde571951e7eefecca
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "surge-xt-1.3.4-setup.exe"
          $log = Join-Path $env:RUNNER_TEMP "surge-xt-setup.log"
          curl.exe -fsSL -o $setup $env:SURGE_URL
          if ($LASTEXITCODE -ne 0) { throw "could not download $env:SURGE_URL" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne $env:SURGE_SHA256) { throw "SHA-256 $hash is not the pinned $env:SURGE_SHA256" }
          $arguments = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=`"$log`""
          $installer = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "the Surge XT installer exited with code $($installer.ExitCode)"
          }
          $bundle = Join-Path $env:CommonProgramFiles "VST3\Surge Synth Team\Surge XT.vst3"
          $binary = Join-Path $bundle "Contents\x86_64-win\Surge XT.vst3"
          $patches = Join-Path $env:ProgramData "Surge XT\patches_factory"
          if (-not (Test-Path -PathType Leaf $binary)) { throw "no plugin binary at $binary" }
          # The Data component installs only the Templates and Tutorials; Patches adds the rest.
          $patch = Join-Path $patches "Basses\Attacky.fxp"
          if (-not (Test-Path -PathType Leaf $patch)) { throw "no factory patch at $patch" }
          $code = "import sys; from pathlib import Path; " +
            "from poser.adapters.pedalboard.instrument import plugin_version; " +
            "print(plugin_version(Path(sys.argv[1])))"
          $version = "$(uv run python -c $code $bundle)".Trim()
          Write-Output "plugin_version: $version"
          if ($LASTEXITCODE -ne 0 -or $version -ne "1.3.4.0") { throw "expected 1.3.4.0" }
      # After Surge XT is installed, so a plugin-free test that searched the machine instead of
      # its isolated host (tests/conftest.py) would find Surge and fail.
      - name: Plugin-free suite (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: uv run pytest -q -rs
      - name: Type-check the Windows backends (required)
        if: ${{ !cancelled() }}
        run: >-
          uv run ty check src/poser/adapters/filesystem_windows.py
          src/poser/adapters/isolation_windows.py src/poser/adapters/isolation.py
          src/poser/adapters/pedalboard/plugin_files.py src/poser/adapters/pedalboard/worker.py
          tests/test_isolation.py
      # The PowerShell blocks of the setup guide and the upgrade guide, as written, in Windows
      # PowerShell 5.1, which ships with Windows. The one change: the studio adds the checkout as
      # its poser in place of the Git URL.
      - name: A Surge XT studio through the documented PowerShell (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: powershell
        run: |
          # Each line's exit code decides, as for a user, not what a native command writes to stderr.
          $ErrorActionPreference = "Continue"
          Remove-Item Env:UV_LOCKED  # The new studio has no lockfile yet.
          function Get-Blocks([string]$Text) {
            $found = [regex]::Matches($Text, '```powershell\r?\n(.*?)```', 'Singleline')
            if ($found.Count -eq 0) { throw "no PowerShell block" }
            foreach ($block in $found) { , @($block.Groups[1].Value.Trim() -split '\r?\n') }
          }
          function Invoke-Lines([string[]]$Lines) {
            foreach ($line in $Lines) {
              Write-Output "PS> $line"
              $global:LASTEXITCODE = 0
              Invoke-Expression $line
              if (-not $? -or $LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE from: $line" }
            }
          }
          $docs = Join-Path $env:GITHUB_WORKSPACE docs
          $setup = Get-Content -Raw -Encoding UTF8 (Join-Path $docs setup.md)
          $section = [regex]::Match($setup, '(?ms)^## Create and verify$(.*?)^## ').Groups[1].Value
          $lines = @(Get-Blocks $section)[0]
          $url = "git+https://github.com/isnbh0/poser"
          $local = @($lines | Where-Object { $_.Contains($url) })
          if ($local.Count -ne 1) { throw "expected one line with $url, found $($local.Count)" }
          $lines = $lines | ForEach-Object { $_.Replace($url, $env:GITHUB_WORKSPACE) }
          Set-Location $env:RUNNER_TEMP
          Invoke-Lines $lines
          $upgrading = Get-Content -Raw -Encoding UTF8 (Join-Path $docs upgrading.md)
          $preamble = ($upgrading -split '(?m)^## ')[0]
          $blocks = @(Get-Blocks $preamble)
          if ($blocks.Count -ne 2) { throw "expected two upgrade blocks, found $($blocks.Count)" }
          Invoke-Lines $blocks[0]
          # The song loop reports each song that fails and goes on. Two broken songs, one in a
          # subfolder, must give two errors, so a loop that finds no song fails here.
          $loop = $blocks[1]
          if ($loop.Count -ne 1) { throw "expected a one-line song loop, found $($loop.Count)" }
          New-Item -ItemType Directory songs\nested | Out-Null
          Set-Content -Path songs\broken.yaml -Value "bpm: 120`ntracks: 3" -Encoding Ascii
          Copy-Item songs\broken.yaml songs\nested\broken.yml
          Get-ChildItem songs -Recurse -File | ForEach-Object { Write-Output "song: $($_.FullName)" }
          # A function named uv runs before uv.exe, so it counts the loop's runs and failures.
          $global:runs = 0
          $global:failures = 0
          function uv {
            $global:runs++
            & uv.exe @args
            if ($LASTEXITCODE -ne 0) { $global:failures++ }
          }
          Write-Output "PS> $($loop[0])"
          Invoke-Expression $loop[0]
          Remove-Item Function:uv
          Write-Output "read-song ran $global:runs times, $global:failures failed"
          if ($global:runs -lt 3) { throw "expected the demo and two broken songs to be read" }
          if ($global:failures -ne 2) { throw "expected two failing songs" }
          $global:LASTEXITCODE = 0  # The step exits with the last broken song's code otherwise.
          Remove-Item -Recurse songs\broken.yaml, songs\nested
      - name: Export the demo and check the studio's configuration (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # A command that fails throws.
          Remove-Item Env:UV_LOCKED
          Set-Location (Join-Path $env:RUNNER_TEMP my-studio)
          uv run export-song songs/demo.yaml --destination deliveries/first-song
          Get-Content poser.toml
          $bundle = Join-Path $env:CommonProgramFiles "VST3\Surge Synth Team\Surge XT.vst3"
          $patches = Join-Path $env:ProgramData "Surge XT\patches_factory"
          $code = "import sys, tomllib; from pathlib import Path; " +
            "config = tomllib.loads(Path('poser.toml').read_text(encoding='utf-8')); " +
            "surge = config['instruments']['surge']; " +
            "assert surge['path'] == str(Path(sys.argv[1]).resolve()), surge; " +
            "assert surge['sources']['presets'] == str(Path(sys.argv[2]).resolve()), surge"
          uv run python -c $code $bundle $patches
          Copy-Item poser.toml (Join-Path $env:GITHUB_WORKSPACE poser.toml)
      # The Effects bundle the Surge XT installer adds joins the studio's configuration as an
      # effect recipe, so the effect test renders a Windows effect plugin; a skip fails.
      - name: Surge XT and Surge XT Effects through Pedalboard (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $effects = Join-Path $env:CommonProgramFiles "VST3\Surge Synth Team\Surge XT Effects.vst3"
          $binary = Join-Path $effects "Contents\x86_64-win\Surge XT Effects.vst3"
          if (-not (Test-Path -PathType Leaf $binary)) { throw "no plugin binary at $binary" }
          $recipe = "`n[effects.surge_effects]`nadapter = `"pedalboard`"`npath = '$effects'`n"
          Add-Content -Encoding utf8 -NoNewline -Path poser.toml -Value $recipe
          Get-Content poser.toml
          # Tee-Object prints each line as it comes, so the log times each test.
          uv run pytest -m real_plugins -v -rs --durations=0 `
            "tests/test_pedalboard_real.py::test_each_instrument_meets_the_instrument_contract" `
            "tests/test_pedalboard_real.py::test_a_render_has_exactly_the_performance_s_frames" `
            "tests/test_pedalboard_real.py::test_a_windows_plugin_loads_from_its_binary_as_from_its_bundle" `
            "tests/test_pedalboard_real.py::test_each_effect_renders_as_many_frames_as_it_is_given" 2>&1 |
            Tee-Object -Variable output
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "the real-plugin tests failed" }
          if ($output -match "skipped") { throw "a real-plugin test skipped" }
      - name: Install SuperCollider (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          SC_URL: https://github.com/supercollider/supercollider/releases/download/Version-3.14.1/SuperCollider-3.14.1_Release-x64-VS-426edf6.exe
          SC_SHA256: ebb27352978539ad5d0e8bb6707cee10c3c59abcd9acb0c2b2d6221081396f30
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "SuperCollider-3.14.1-setup.exe"
          curl.exe -fsSL -o $setup $env:SC_URL
          if ($LASTEXITCODE -ne 0) { throw "could not download $env:SC_URL" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne $env:SC_SHA256) { throw "SHA-256 $hash is not the pinned $env:SC_SHA256" }
          # An NSIS installer: /S runs it silently into its default folder.
          $installer = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "the SuperCollider installer exited with code $($installer.ExitCode)"
          }
          $scsynth = Join-Path $env:ProgramFiles "SuperCollider-3.14.1\scsynth.exe"
          if (-not (Test-Path -PathType Leaf $scsynth)) { throw "no engine at $scsynth" }
      # Without SCSYNTH_PATH, so the tests' own lookup finds the installed engine; a skip fails.
      - name: scsynth renders (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $output = uv run pytest -m real_scsynth -q -rs tests/test_scsynth_real.py 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { throw "the real-scsynth tests failed" }
          if ($output -match "skipped") { throw "a real-scsynth test skipped" }
      # Windows reads its long-paths switch when a program starts. With the switch off, the
      # file-system contract measures the MAX_PATH limits poser reports, and render-song refuses a
      # song whose results would pass them, naming the fix. With it on, the contract measures the
      # long limits, the same song renders, and Surge XT and scsynth render in a directory past
      # MAX_PATH. The step restores the runner's setting.
      - name: Long paths off and on (required)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          $PSNativeCommandUseErrorActionPreference = $false  # Exit codes are checked by hand.
          Remove-Item Env:UV_LOCKED
          $key = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          $original = (Get-ItemProperty -Path $key).LongPathsEnabled  # $null when unset.
          Write-Output "LongPathsEnabled was: $original"
          $studio = Join-Path $env:RUNNER_TEMP my-studio
          # A song whose path and the studio's together hold 180 characters, past the 165 the
          # setup guide states, while the song file itself stays inside MAX_PATH.
          $name = 180 - $studio.Length - "/songs//demo.yaml".Length
          if ($name -lt 1 -or $name -gt 200) { throw "the studio path leaves $name for a folder" }
          $song = "songs/" + ("d" * $name) + "/demo.yaml"
          $deep = Join-Path $env:RUNNER_TEMP ("s" * 230)
          function Set-LongPaths([int]$Value) {
            Set-ItemProperty -Path $key -Name LongPathsEnabled -Value $Value -Type DWord
            $env:POSER_EXPECT_LONG_PATHS = "$Value"
            $basetemp = Join-Path $env:RUNNER_TEMP "limit-$Value"
            uv run --directory $env:GITHUB_WORKSPACE pytest -q -p no:cacheprovider `
              --basetemp $basetemp "tests/test_filesystem.py::test_the_path_limit_is_where_the_system_refuses"
            if ($LASTEXITCODE -ne 0) { throw "the path limit is not where Windows refuses" }
          }
          try {
            Push-Location $studio
            New-Item -ItemType Directory (Split-Path $song) | Out-Null
            Copy-Item songs/demo.yaml $song

            Set-LongPaths 0
            $errors = Join-Path $env:RUNNER_TEMP render-errors.txt
            uv run render-song $song 2> $errors
            $status = $LASTEXITCODE
            $refusal = Get-Content -Raw $errors
            Write-Output $refusal
            if ($status -ne 2) { throw "render-song exited $status, not 2, for a song past MAX_PATH" }
            $fix = "turn on Windows long paths as " +
              "https://github.com/isnbh0/poser/blob/main/docs/setup.md#prerequisites shows"
            foreach ($part in "cannot keep its results: its directory", "past the 247", $fix) {
              if (-not $refusal.Contains($part)) { throw "the refusal does not say: $part" }
            }

            Set-LongPaths 1
            uv run render-song $song
            if ($LASTEXITCODE -ne 0) { throw "render-song failed with long paths on" }
            $longest = (Get-ChildItem -Recurse -File (Join-Path renders $song) |
              Measure-Object -Maximum { $_.FullName.Length }).Maximum
            Write-Output "longest result path: $longest characters"
            if ($longest -le 260) { throw "no result passed MAX_PATH" }
            Pop-Location

            uv run pytest -m "real_plugins or real_scsynth" -q -rs -p no:cacheprovider --basetemp $deep `
              "tests/test_pedalboard_real.py::test_a_render_has_exactly_the_performance_s_frames" `
              tests/test_scsynth_real.py
            if ($LASTEXITCODE -ne 0) { throw "an instrument failed to render past MAX_PATH" }
          } finally {
            if ($null -eq $original) {
              Remove-ItemProperty -Path $key -Name LongPathsEnabled
            } else {
              Set-ItemProperty -Path $key -Name LongPathsEnabled -Value $original -Type DWord
            }
          }
