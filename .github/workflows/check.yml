name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check

  distribution:
    name: Plugin-free packaging (${{ matrix.artifact }})
    runs-on: macos-latest
    strategy:
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build and install a clean distribution
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          uv build --out-dir "$RUNNER_TEMP/poser-dist"
          uv venv --python 3.13 "$RUNNER_TEMP/poser-venv"
          if [ "$ARTIFACT" = wheel ]; then
            uv pip install --python "$RUNNER_TEMP/poser-venv/bin/python" "$RUNNER_TEMP"/poser-dist/*.whl
          else
            uv pip install --python "$RUNNER_TEMP/poser-venv/bin/python" "$RUNNER_TEMP"/poser-dist/*.tar.gz
          fi
      - name: Smoke packaging only (no real plugin or audio acceptance)
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/poser-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_distribution.py"

  windows:
    name: Windows (file system and platform gate)
    runs-on: windows-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Imports, file system, and platform gate (required)
        run: >-
          uv run pytest -q -rs tests/test_imports.py tests/test_unsupported_platform.py
          tests/test_filesystem.py tests/test_filesystem_selection.py tests/test_filestore.py
      - name: Type-check the Windows backend (required)
        run: uv run ty check src/poser/adapters/filesystem_windows.py
      - name: Plugin-free suite (inventory, not yet required on Windows)
        continue-on-error: true
        timeout-minutes: 30
        run: uv run pytest -q --tb=no -rfE
