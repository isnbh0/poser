# Plugins that `check-plugins` tests. Add an entry to check another plugin.
# Multi-plugin bundles also need `plugin_name`. `presets` names a folder of .fxp presets that
# songs can use as `<plugin name>:<path without .fxp>`.

[[plugin]]
name = "Serum"
path = "/Library/Audio/Plug-Ins/VST3/Serum.vst3"
presets = "/Library/Audio/Presets/Xfer Records/Serum Presets/Presets"

[[plugin]]
name = "Primer"
path = "/Library/Audio/Plug-Ins/VST3/Primer.vst3"
