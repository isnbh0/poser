[project]
name = "poser"
version = "0.1.0"
description = "Compose multitrack music through VST instruments from code"
authors = [
    { name = "John Choi", email = "5154439+isnbh0@users.noreply.github.com" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/isnbh0/poser"

[project.scripts]
check-plugins = "poser.plugin_check:main"
render-song = "poser.render:main"
analyze-song = "poser.analyze:main"
save-sound = "poser.sounds:save_main"
list-sounds = "poser.sounds:list_main"
init-workspace = "poser.init_workspace:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
lint = [
    "ruff>=0.17.4",
    "ty>=0.0.98",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "PL", "ANN", "PIE", "RET", "TC",
    "A", "N", "DTZ", "PGH", "PERF", "FURB", "PTH", "ARG", "S", "BLE", "LOG", "G", "ISC", "T10",
    "RSE", "FLY", "TRY", "TID", "FBT", "ERA",
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "PLC0415", "TRY003", "S603", "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "FBT", "SLF001", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use object, a TypedDict, a Protocol, or a concrete type."
"typing_extensions.Any".msg = "Use object, a TypedDict, a Protocol, or a concrete type."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not real_plugins", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "real_plugins: loads the plugins installed on this machine",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
missing-type-argument = "error"
blanket-ignore-comment = "error"
missing-override-decorator = "error"
unsound-assignment = "error"
