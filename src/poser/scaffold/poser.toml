# Instruments that songs name in a track's `sound`. Each table's name is the instrument's name.
# `adapter = "pedalboard"` loads a VST3 or Audio Unit plugin from `path`. A multi-plugin bundle
# also needs `plugin_name`. Each entry under `sources` names a folder of presets, which songs use
# as `<instrument>:<source>/<path without suffix>`. Sounds saved with `save-sound` are the
# source `saved`. `guide` is a note about the instrument for the workspace guide; run
# `uv run update-guide` after changing this file.

# Surge XT is a free, open-source synthesizer, and poser's default instrument. Its packaged
# installer installs for all users, putting the plugin and the factory patches at the paths
# below; a per-user install puts them under ~/Library instead. Change them to match this
# machine, and run `uv run update-guide` after editing.
[instruments.surge]
adapter = "pedalboard"
path = "/Library/Audio/Plug-Ins/VST3/Surge XT.vst3"
guide = """
No synthesizer was detected when this workspace was created, so songs cannot render yet. \
Install Surge XT (https://surge-synthesizer.github.io/downloads), then run \
`uv run check-instruments`, and replace this guide text with a note about the instrument. \
Its factory patches, such as `surge:presets/Basses/Attacky`, are .fxp files under presets/ \
by category."""

[instruments.surge.sources]
presets = "/Library/Application Support/Surge XT/patches_factory"

